name: CI


on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release-wasm:
        type: boolean
        default: false
      release-models:
        type: boolean
        default: false


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
          cache: pip
          cache-dependency-path: requirements.frozen.txt
      
      - name: Build
        run: |
          mkdir cpp/build
          cd cpp/build
          cmake ..
          make
      
      - name: pytest
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple        \
            -r requirements.frozen.txt
          ./run_tests.sh
      
  
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
          cache: pip
          cache-dependency-path: requirements.frozen.txt

      - name: fetch-from-huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir models
          cd models
          git clone --depth 1 --no-single-branch https://user:${HF_TOKEN}@huggingface.co/carrot-qwa/angiosperm-treerings
          cd angiosperm-treerings
          git branch   # for debugging
          git checkout release-candidate || git checkout main
          ls -halt
          # only one modelfile
          python -c "import glob; assert len(glob.glob('./*.pt.zip')) == 1"


      - name: pip-install
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple        \
            -r ./requirements.frozen.txt

      - name: export
        run: |
          cd models/angiosperm-treerings
          MODELFILE=$(realpath ./*.pt.zip)
          echo $MODELFILE
          python ../../update-yolo.py --model=$MODELFILE

          CARROTFILE=$(realpath ./angiosperm-treerings.carrot.pt.zip)
          ONNXFILE=$(realpath ./angiosperm-treerings.onnx)
          
          # NOTE: if on main branch, there is alread a carrot.pt.zip
          # use the most recent one
          mv $(ls -t -- *.pt.zip | head -n 1) $CARROTFILE
          # same with onnx
          mv $(ls -t -- *.onnx | head -n 1) $ONNXFILE

          # running twice to make sure the hash is deterministic
          # NOTE: file name is important, therefore copying to a new folder
          mkdir COPY && cd COPY
          cp $MODELFILE ./
          python ../../../update-yolo.py --model ./*.pt.zip

          ls -halt
          COPY_CARROTFILE=$(ls -t -- *.pt.zip | head -n 1)
          COPY_ONNXFILE=$(ls -t -- *.onnx | head -n 1)

          sha256sum ../*.pt.zip ./*.carrot.pt.zip
          test "$(sha256sum $CARROTFILE | cut -d' ' -f1)" = \
              "$(sha256sum $COPY_CARROTFILE | cut -d' ' -f1)"

          sha256sum ../*.onnx ./*.onnx
          test "$(sha256sum $ONNXFILE | cut -d' ' -f1)" = \
              "$(sha256sum $COPY_ONNXFILE | cut -d' ' -f1)"

          cd ..
          rm -r COPY

          echo "CARROTFILE=${CARROTFILE}" >> "$GITHUB_ENV"
          echo "ONNXFILE=${ONNXFILE}" >> "$GITHUB_ENV"


      - name: smoke-test
        run: |
          python inference.py \
            --model=${{ env.CARROTFILE }} \
            --input=tests/assets/black.png \
            --px-per-mm=1000 \
            --output=/tmp/DELETE
      

      - name: Archive Models
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: |
            ${{ env.CARROTFILE }}
            ${{ env.ONNXFILE }}
          if-no-files-found: error


      - name: Release
        if: ${{ github.event.inputs.release-models == 'true' }}
        run: |
          # copy files before hard reset
          cp ${{env.CARROTFILE}} ./
          cp ${{env.ONNXFILE}} ./
          
          cd models/angiosperm-treerings

          # reset
          git checkout --force main
          cp ../../$(basename ${{env.CARROTFILE}}) ${{env.CARROTFILE}}
          cp ../../$(basename ${{env.ONNXFILE}})   ${{env.ONNXFILE}}
          ls


          # make sure only one .pt.zip and .onnx
          python -c "import glob; assert len(glob.glob('./*.pt.zip')) == 1"
          python -c "import glob; assert len(glob.glob('./*.onnx')) == 1"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{env.CARROTFILE}}
          git add ${{env.ONNXFILE}}
          if ! git diff --cached --quiet; then
              TAGNAME=v$(date +%F)
              echo $TAGNAME
              git commit -m "$TAGNAME"
              git tag --force $TAGNAME
              git push origin main
              git push origin --tags
          else
            echo "No changes"
          fi


