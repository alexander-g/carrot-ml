  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
          actions-cache-folder: 'emsdk-cache'

      - name: Deno
        run: |
          ./deno.sh task cache
      
      - name: Build
        run: |
          emcc -v
          mkdir cpp/build-wasm
          cd cpp/build-wasm
          emcmake cmake ..                      \
            -DCMAKE_BUILD_TYPE=Release          \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          emmake make
          ../../deno.sh bundle --minify --outdir=./bundle ../carrot-wasm-postprocessing.ts

      - name: Test
        run: |
          ./run_tests_deno.sh
      
      - name: Archive JS module
        uses: actions/upload-artifact@v7
        with:
          name: modules
          path: |
            cpp/build-wasm/bundle/carrot-wasm-postprocessing.js
            cpp/carrot-wasm-postprocessing.d.ts
          if-no-files-found: error

  release-wasm:
    needs:   build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.inputs.release-wasm == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: modules
          path: artifact/

      - name: Release
        run: |
          TAGNAME=v$(date +%F)
          echo $TAGNAME

          git fetch origin wasm-releases
          git checkout wasm-releases
          cp artifact/carrot-wasm-postprocessing.d.ts ./
          cp artifact/build-wasm/bundle/carrot-wasm-postprocessing.js ./
          rm -r artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./carrot-wasm-postprocessing.*
          git commit -m "$TAGNAME"
          git tag --force $TAGNAME
          git push origin wasm-releases
          git push origin --tags


