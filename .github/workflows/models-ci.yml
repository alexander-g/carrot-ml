name: models-CI


on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release-models:
        type: boolean
        default: false


jobs:
  models-treerings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
          cache: pip
          cache-dependency-path: requirements.frozen.txt

      - name: fetch-from-huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir models
          cd models
          git clone --depth 1 --no-single-branch https://user:${HF_TOKEN}@huggingface.co/carrot-qwa/angiosperm-treerings
          cd angiosperm-treerings
          git -C angiosperm-treerings branch   # for debugging
          
      - name: pip-install
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple        \
            -r ./requirements.frozen.txt

      - name: update-and-test
        run: |
          model_dir=models/angiosperm-treerings
          bash .git/workflows/scripts/backward-update-test.sh

          # the most recent .pt.zip and .onnx files
          updated_ptzip=$(realpath $(ls -t -- $model_dir/*.pt.zip | head -n 1))
          updated_onnx=$(realpath $(ls -t -- $model_dir/*.onnx | head -n 1))
          echo "CARROTFILE=${updated_ptzip}" >> "$GITHUB_ENV"
          echo "ONNXFILE=${updated_onnx}" >> "$GITHUB_ENV"


      - name: Archive Models
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: |
            ${{ env.CARROTFILE }}
            ${{ env.ONNXFILE }}
          if-no-files-found: error


      - name: Release
        if: ${{ github.event.inputs.release-models == 'true' }}
        run: |
          # copy files before hard reset
          cp ${{env.CARROTFILE}} ./
          cp ${{env.ONNXFILE}} ./
          
          cd models/angiosperm-treerings

          # reset
          git checkout --force main
          cp ../../$(basename ${{env.CARROTFILE}}) ${{env.CARROTFILE}}
          cp ../../$(basename ${{env.ONNXFILE}})   ${{env.ONNXFILE}}
          ls


          # make sure only one .pt.zip and .onnx
          python -c "import glob; assert len(glob.glob('./*.pt.zip')) == 1"
          python -c "import glob; assert len(glob.glob('./*.onnx')) == 1"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{env.CARROTFILE}}
          git add ${{env.ONNXFILE}}
          if ! git diff --cached --quiet; then
              TAGNAME=v$(date +%F)
              echo $TAGNAME
              git commit -m "$TAGNAME"
              git tag --force $TAGNAME
              git push origin main
              git push origin --tags
          else
            echo "No changes"
          fi


  models-cells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
          cache: pip
          cache-dependency-path: requirements.frozen.txt

      - name: fetch-from-huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir models
          cd models
          git clone --depth 1 --no-single-branch https://user:${HF_TOKEN}@huggingface.co/carrot-qwa/angiosperm-vessels
          git -C angiosperm-vessels branch

      - name: pip-install
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple        \
            -r ./requirements.frozen.txt
      
      - name: update-and-test
        run: |
          model_dir=models/angiosperm-vessels
          bash .git/workflows/scripts/backward-update-test.sh

          # the most recent .pt.zip and .onnx files
          updated_ptzip=$(realpath $(ls -t -- $model_dir/*.pt.zip | head -n 1))
          updated_onnx=$(realpath $(ls -t -- $model_dir/*.onnx | head -n 1))
          echo "CARROTFILE=${updated_ptzip}" >> "$GITHUB_ENV"
          echo "ONNXFILE=${updated_onnx}" >> "$GITHUB_ENV"

      - name: evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone --depth 1 https://user:${HF_TOKEN}@huggingface.co/datasets/carrot-qwa/angiosperm-vessels-validation-set
          git clone --depth 1 https://github.com/alexander-g/carrot-evaluation
          
          python inference.py \
            --model=${{env.CARROTFILE}} \
            --input=angiosperm-vessels-validation-set/splitfile.txt \
            --px-per-mm=1000                                        \
            --output=inference/

          echo "TODO: pip install the deps of the evaluation repo"
          python carrot-evaluation/evaluate.py \
            --outputs=inference/ \
            --annotations=angiosperm-vessels-validation-set/splitfile.txt
          cat inference/metrics.json
      

      - name: Archive Models
        uses: actions/upload-artifact@v7
        with:
          name: models-cells
          path: |
            ${{ env.CARROTFILE }}
            ${{ env.ONNXFILE }}
          if-no-files-found: error
      
